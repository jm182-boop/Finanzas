<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fin. — Finanzas Personales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f13;--bg2:#16161c;--bg3:#1e1e27;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0f0f5;--text2:#9090a8;--text3:#5a5a72;--accent:#7c6dfa;--accent2:#a594fb;--green:#3ecf8e;--amber:#f59e0b;--red:#f87171;--teal:#2dd4bf;--radius:12px;--radius-sm:8px}
.light{--bg:#f0f0f5;--bg2:#ffffff;--bg3:#e8e8f0;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);--text:#1a1a2e;--text2:#5a5a72;--text3:#9090a8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:400px}
.auth-logo{font-size:28px;font-weight:600;margin-bottom:6px}.auth-logo span{color:var(--accent2)}
.auth-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.auth-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:var(--radius-sm);padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;border:none;background:none;color:var(--text2);cursor:pointer;border-radius:6px;font-family:'Poppins',sans-serif}
.auth-tab.active{background:var(--bg2);color:var(--text)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.fg input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:'Poppins',sans-serif;outline:none}
.fg input:focus{border-color:var(--accent)}
.btn-p{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;font-family:'Poppins',sans-serif}
.btn-p:hover{opacity:.85}
.auth-msg{font-size:13px;text-align:center;margin-top:10px}
.auth-msg.err{color:var(--red)}.auth-msg.suc{color:var(--green)}

/* APP */
#app{display:none;max-width:520px;margin:0 auto;padding-bottom:80px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0}
.topbar-title{font-size:18px;font-weight:600}
.topbar-user{font-size:11px;color:var(--text2);margin-top:1px}
.topbar-right{display:flex;gap:8px;align-items:center}
.btn-icon{background:none;border:1px solid var(--border2);color:var(--text2);width:32px;height:32px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-out{background:none;border:1px solid var(--border2);color:var(--text2);padding:6px 12px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;font-family:'Poppins',sans-serif}
.btn-out:hover{color:var(--red);border-color:var(--red)}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100}
.nb{flex:1;padding:8px 2px 12px;background:none;border:none;color:var(--text3);font-size:9px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:'Poppins',sans-serif;transition:color .2s}
.nb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb.active{color:var(--accent2)}

/* PAGES */
.page{display:none;padding:14px 18px}.page.active{display:block}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.ct{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}

/* METRICS */
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.met{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.ml{font-size:10px;color:var(--text3);margin-bottom:4px}
.mv{font-size:16px;font-weight:600}
.mv.ok{color:var(--green)}.mv.bad{color:var(--red)}

/* PROGRESS */
.pw{margin-bottom:12px}
.ph{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.pl{color:var(--text2);font-weight:500}.pn{color:var(--text);font-size:11px}
.pb{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .4s}
.pa{font-size:11px;color:var(--amber);margin-top:2px}

/* ROWS */
.ri{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.ri:last-child{border-bottom:none}
.rl{font-size:13px;color:var(--text2)}.rr{font-size:13px;font-weight:600}

/* FORM */
.fi{margin-bottom:12px}
.fi label{display:block;font-size:10px;color:var(--text3);margin-bottom:5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.fi input,.fi select,.fi textarea{width:100%;padding:9px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:'Poppins',sans-serif;outline:none}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--accent)}
.fi select option{background:var(--bg2)}
.fi textarea{resize:none;height:56px}
.tc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-s{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;font-family:'Poppins',sans-serif;margin-top:4px}
.btn-s:hover{opacity:.85}
.btn-ghost{width:100%;padding:10px;background:none;color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;font-family:'Poppins',sans-serif;margin-top:8px}
.btn-ghost:hover{color:var(--teal);border-color:var(--teal)}

/* RANGE */
.rr2{display:flex;align-items:center;gap:8px}
.rr2 input[type=range]{flex:1;accent-color:var(--accent)}
.rv{font-size:13px;font-weight:500;color:var(--accent2);min-width:32px;text-align:right}

/* TOGGLE TIPO */
.tt{display:flex;gap:4px;background:var(--bg3);border-radius:var(--radius-sm);padding:3px;margin-bottom:12px}
.tb{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;border:none;background:none;color:var(--text2);cursor:pointer;border-radius:6px;font-family:'Poppins',sans-serif}
.tb.ag{background:rgba(248,113,113,.2);color:var(--red)}
.tb.ai{background:rgba(62,207,142,.2);color:var(--green)}

/* HISTORIAL ITEMS */
.gi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.gt{display:flex;justify-content:space-between;align-items:flex-start}
.gd{font-size:14px;font-weight:500;margin-bottom:2px}
.gm2{font-size:11px;color:var(--text3)}
.ghr{font-size:10px;color:var(--text3);margin-top:1px}
.gnota{font-size:12px;color:var(--text2);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.gright{text-align:right;flex-shrink:0;margin-left:10px}
.gmonto{font-size:15px;font-weight:600;margin-bottom:4px}
.gmonto.ing{color:var(--green)}.gmonto.gas{color:var(--text)}
.bdel{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;font-family:'Poppins',sans-serif}
.bdel:hover{color:var(--red)}

/* BADGE */
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.bg{background:rgba(62,207,142,.15);color:var(--green)}
.ba{background:rgba(245,158,11,.15);color:var(--amber)}
.br{background:rgba(248,113,113,.15);color:var(--red)}

/* ALERTS */
.al{padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:10px}
.al-w{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--amber)}
.al-g{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3);color:var(--green)}
.al-b{background:rgba(124,109,250,.1);border:1px solid rgba(124,109,250,.3);color:var(--accent2)}
.comp{font-size:12px;padding:7px 10px;border-radius:var(--radius-sm);margin-bottom:8px}
.cu{background:rgba(248,113,113,.1);color:var(--red)}.cd{background:rgba(62,207,142,.1);color:var(--green)}

/* CHECKLIST */
.chk-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.chk-item:last-child{border-bottom:none}
.chk-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.chk-box.done{background:var(--green);border-color:var(--green)}
.chk-box.done::after{content:'✓';color:#fff;font-size:12px;font-weight:600}
.chk-label{font-size:13px;color:var(--text2);flex:1;transition:all .2s}
.chk-label.done{color:var(--text3);text-decoration:line-through}
.chk-monto{font-size:12px;color:var(--text3);font-weight:500}

/* AHORROS */
.ahorro-hero{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:var(--radius);padding:18px;margin-bottom:10px;color:#fff}
.ah-label{font-size:12px;opacity:.8;margin-bottom:4px}
.ah-value{font-size:26px;font-weight:600}
.chart-wrap{position:relative;height:200px;margin-top:6px}
.color-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cp-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .2s}
.cp-dot:hover{transform:scale(1.15)}
.cp-dot.selected{border-color:var(--text);transform:scale(1.1)}

/* PRESTAMOS */
.prest-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px}
.prest-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.prest-nombre{font-size:14px;font-weight:600}
.prest-desc{font-size:12px;color:var(--text3);margin-top:2px}
.prest-cuota{font-size:13px;font-weight:500;color:var(--accent2)}
.prest-prog{margin-top:8px}
.prest-atrasado{font-size:11px;color:var(--red);margin-top:4px}
.prest-saldado{font-size:11px;color:var(--green);margin-top:4px}

/* MES NAV */
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mnav{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);padding:5px 12px;cursor:pointer;font-size:16px;line-height:1}
.mnav:hover{color:var(--text)}
.mlabel{font-size:14px;font-weight:600}

/* CHAT */
.cw{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:280px;overflow-y:auto}
.cm{padding:9px 12px;border-radius:var(--radius);font-size:13px;line-height:1.5;max-width:92%}
.cm.u{background:var(--accent);color:#fff;align-self:flex-end}
.cm.a{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.cm.th{color:var(--text3);font-style:italic}
.ci{display:flex;gap:8px}
.ci input{flex:1;padding:9px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:'Poppins',sans-serif;outline:none}
.ci input:focus{border-color:var(--accent)}
.csend{padding:9px 14px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:14px}
.qb{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.qbtn{padding:5px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;color:var(--text2);font-size:11px;cursor:pointer;font-family:'Poppins',sans-serif}
.qbtn:hover{border-color:var(--accent);color:var(--accent2)}

.aho-disp{padding:9px 11px;background:var(--bg3);border-radius:var(--radius-sm);font-size:13px;color:var(--text2);margin-top:3px}
.empty{text-align:center;padding:32px 20px;color:var(--text3);font-size:14px}
.sp{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:9px 18px;border-radius:var(--radius);font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">fin<span>.</span></div>
    <div class="auth-sub">Tu administrador de finanzas personales</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Iniciar sesion</button>
      <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
    </div>
    <div class="fg"><label>Email</label><input type="email" id="ae" placeholder="tu@email.com"></div>
    <div class="fg"><label>Contrasena</label><input type="password" id="ap" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth()"></div>
    <button class="btn-p" onclick="doAuth()" id="auth-btn">Iniciar sesion</button>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div><div class="topbar-title">fin<span style="color:var(--accent2)">.</span></div><div class="topbar-user" id="uemail"></div></div>
    <div class="topbar-right">
      <button class="btn-icon" onclick="toggleTheme()" id="tbtn">🌙</button>
      <button class="btn-out" onclick="logout()">Salir</button>
    </div>
  </div>

  <!-- RESUMEN -->
  <div id="page-resumen" class="page active">
    <div style="margin-top:14px">
      <div class="mn"><button class="mnav" onclick="changeMonth(-1)">‹</button><span class="mlabel" id="mlabel"></span><button class="mnav" onclick="changeMonth(1)">›</button></div>
      <div id="resumen-content"></div>
    </div>
  </div>

  <!-- REGISTRAR -->
  <div id="page-registrar" class="page">
    <div style="margin-top:14px">
      <div class="card">
        <div class="tt">
          <button class="tb ag" id="btg" onclick="setTipo('gasto')">Gasto</button>
          <button class="tb" id="bti" onclick="setTipo('ingreso')">Ingreso</button>
        </div>
        <div class="fi"><label>Descripcion</label><input type="text" id="gdesc" placeholder="ej: supermercado..."></div>
        <div class="fi"><label>Monto ($ARS)</label><input type="text" id="gmonto" placeholder="0" oninput="fmtI(this)"></div>
        <div id="campos-gasto">
          <div class="tc">
            <div class="fi"><label>Categoria</label>
              <select id="gcat">
                <option value="casa">Tarjeta Casa</option>
                <option value="pareja">Tarjeta Pareja</option>
                <option value="personal">Tarjeta Personal</option>
                <option value="alquiler">Alquiler/Expensas</option>
                <option value="otro">Otro</option>
              </select>
            </div>
            <div class="fi"><label>Fecha</label><input type="date" id="gfecha"></div>
          </div>
          <div class="tc">
            <div class="fi"><label>Cuotas (opcional)</label><input type="text" id="gcuotas" placeholder="ej: 6" oninput="fmtI(this)"></div>
            <div class="fi"><label>N° cuota actual</label><input type="text" id="gcuota-num" placeholder="ej: 1" oninput="fmtI(this)"></div>
          </div>
        </div>
        <div id="campos-ingreso" style="display:none">
          <div class="tc">
            <div class="fi"><label>Tipo</label>
              <select id="gti">
                <option value="sueldo">Sueldo</option>
                <option value="freelance">Freelance</option>
                <option value="venta">Venta</option>
                <option value="otro">Otro</option>
              </select>
            </div>
            <div class="fi"><label>Fecha</label><input type="date" id="gfechai"></div>
          </div>
        </div>
        <div class="fi"><label>Nota (opcional)</label><textarea id="gnota" placeholder="Detalles adicionales..."></textarea></div>
        <button class="btn-s" onclick="agregarMov()" id="btnagregar">Guardar gasto</button>
      </div>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div id="page-historial" class="page">
    <div style="margin-top:14px">
      <div class="mn"><button class="mnav" onclick="changeMonth(-1)">‹</button><span class="mlabel" id="mlabel2"></span><button class="mnav" onclick="changeMonth(1)">›</button></div>
      <div style="display:flex;gap:5px;margin-bottom:10px" id="hfiltros">
        <button class="qbtn" id="ft" onclick="setFiltro('todo',this)" style="border-color:var(--accent);color:var(--accent2)">Todo</button>
        <button class="qbtn" id="fg2" onclick="setFiltro('gasto',this)">Gastos</button>
        <button class="qbtn" id="fi2" onclick="setFiltro('ingreso',this)">Ingresos</button>
      </div>
      <div id="historial-content"></div>
    </div>
  </div>

  <!-- AHORROS -->
  <div id="page-ahorros" class="page">
    <div style="margin-top:14px">
      <div id="ahero"></div>
      <div class="card">
        <div class="ct">Evolucion</div>
        <div style="display:flex;gap:5px;margin-bottom:8px">
          <button class="qbtn" id="cht-tot" onclick="setChartMode('total',this)" style="border-color:var(--accent);color:var(--accent2)">Total</button>
          <button class="qbtn" id="cht-des" onclick="setChartMode('desglose',this)">Por billetera</button>
        </div>
        <div class="chart-wrap"><canvas id="achrt"></canvas></div>
      </div>
      <div class="card"><div class="ct">Por billetera</div><div id="bill-list"></div></div>
      <div class="card">
        <div class="ct">Registrar deposito</div>
        <div class="fi"><label>Monto ($ARS)</label><input type="text" id="amonto" placeholder="0" oninput="fmtI(this)"></div>
        <div class="tc">
          <div class="fi"><label>Billetera</label>
            <select id="abilletera">
              <option>Mercado Pago</option><option>Naranja X</option><option>Binance</option>
              <option>Wise</option><option>Banco</option><option>Efectivo</option><option value="__custom">Otra...</option>
            </select>
          </div>
          <div class="fi"><label>Fecha</label><input type="date" id="afecha"></div>
        </div>
        <div class="fi" id="custom-bill-wrap" style="display:none"><label>Nombre de billetera</label><input type="text" id="acustom" placeholder="ej: Lemon Cash"></div>
        <div class="fi">
          <label>Color</label>
          <div class="color-picker" id="cpicker"></div>
        </div>
        <div class="fi"><label>Nota (opcional)</label><input type="text" id="anota" placeholder="ej: ahorro mayo"></div>
        <button class="btn-s" onclick="agregarAhorro()" id="btnahorro">Guardar deposito</button>
      </div>
      <div class="card"><div class="ct">Historial de depositos</div><div id="ahist"></div></div>
    </div>
  </div>

  <!-- PRESTAMOS -->
  <div id="page-prestamos" class="page">
    <div style="margin-top:14px">
      <div class="mn"><button class="mnav" onclick="changeMonth(-1)">‹</button><span class="mlabel" id="mlabel3"></span><button class="mnav" onclick="changeMonth(1)">›</button></div>
      <div id="prest-lista"></div>
      <div class="card">
        <div class="ct">Nuevo prestamo</div>
        <div class="fi"><label>Nombre / Deudor</label><input type="text" id="pnombre" placeholder="ej: Carlos, Tarjeta Visa..."></div>
        <div class="fi"><label>Descripcion</label><input type="text" id="pdesc" placeholder="ej: prestamo personal"></div>
        <div class="tc">
          <div class="fi"><label>Monto por cuota</label><input type="text" id="pmonto" placeholder="0" oninput="fmtI(this)"></div>
          <div class="fi"><label>Total cuotas</label><input type="text" id="pcuotas" placeholder="ej: 12" oninput="fmtI(this)"></div>
        </div>
        <div class="fi"><label>Fecha de inicio</label><input type="date" id="pfecha"></div>

function renderResumen(){
  ['mlabel'].forEach(id=>document.getElementById(id).textContent=mesLabel(curMes));
  const gm=movDelMes(),gastosM=gm.filter(m=>m.tipo!=='ingreso'),ingresosM=gm.filter(m=>m.tipo==='ingreso');
  const ingrExtra=ingresosM.reduce((a,b)=>a+b.monto,0),ingrTotal=cfg.sueldo+ingrExtra;
  const alqArs=cfg.alqUsd*cfg.tc,totalViv=alqArs+cfg.exp;
  const presNec=ingrTotal*cfg.nec/100,presDes=ingrTotal*cfg.des/100,presAho=ingrTotal*cfg.aho/100;
  const gastCasa=gastosM.filter(g=>g.categoria==='casa').reduce((a,b)=>a+b.monto,0);
  const gastPar=gastosM.filter(g=>g.categoria==='pareja').reduce((a,b)=>a+b.monto,0);
  const gastPers=gastosM.filter(g=>g.categoria==='personal').reduce((a,b)=>a+b.monto,0);
  const gastAho=ahorros.filter(a=>a.fecha?.startsWith(curMes)).reduce((a,b)=>a+b.monto,0);
  const gastNec=totalViv+gastCasa,gastDes=gastPar+gastPers,totalGast=gastNec+gastDes+gastAho;
  const sob=ingrTotal-totalGast,sobOk=sob>=0;
  const prevM=(()=>{const[y,m]=curMes.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');})();
  const prevGast=movDelMes(prevM).filter(m=>m.tipo!=='ingreso').reduce((a,b)=>a+b.monto,0);
  const diff=totalGast-prevGast,diffP=prevGast>0?Math.abs(Math.round(diff/prevGast*100)):0;

  // checklist conceptos
  const conceptos=[
    {key:'alquiler',label:'Alquiler',monto:alqArs},
    {key:'expensas',label:'Expensas',monto:cfg.exp},
    {key:'t-casa',label:'Tarjeta Casa',monto:gastCasa},

  setTimeout(()=>{
    const ctx=document.getElementById('pgasto');if(!ctx)return;
    if(chartG)chartG.destroy();
    const tc=darkMode?'#9090a8':'#5a5a72';
    chartG=new Chart(ctx,{type:'doughnut',data:{labels:['T. Casa','T. Pareja','T. Personal','Vivienda','Ahorro'],datasets:[{data:[gastCasa,gastPar,gastPers,totalViv,gastAho],backgroundColor:['#7c6dfa','#3ecf8e','#f59e0b','#2dd4bf','#a594fb'],borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:tc,font:{family:'Poppins',size:10},boxWidth:8,padding:10}}}}});

function setFiltro(f,btn){filtro=f;document.querySelectorAll('#hfiltros .qbtn').forEach(b=>{b.style.borderColor='';b.style.color='';});btn.style.borderColor='var(--accent)';btn.style.color='var(--accent2)';renderHistorial();}

// RENDER AHORROS
function renderAhorros(){
  const total=ahorros.reduce((a,b)=>a+b.monto,0);
  document.getElementById('ahero').innerHTML=`<div class="ahorro-hero"><div class="ah-label">Total ahorrado</div><div class="ah-value">${fmt(total)}</div><div style="font-size:12px;opacity:.7;margin-top:4px">${ahorros.length} depositos</div></div>`;

  const bkeys=Object.keys(bmap);
  document.getElementById('bill-list').innerHTML=bkeys.length?bkeys.map(b=>`<div class="ri"><div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;border-radius:50%;background:${bmap[b].color};flex-shrink:0"></div><span class="rl">${b}</span></div><span class="rr">${fmt(bmap[b].total)}</span></div>`).join(''):'<div class="empty" style="padding:16px">Sin depositos aun</div>';
  document.getElementById('ahist').innerHTML=ahorros.length?[...ahorros].reverse().map(a=>`<div class="gi"><div class="gt"><div><div class="gd">${a.billetera}${a.nota?' · '+a.nota:''}</div><div class="gm2">${a.fecha}</div></div><div class="gright"><div class="gmonto ing">+${fmt(a.monto)}</div><button class="bdel" onclick="eliminarAhorro(${a.id})">×</button></div></div></div>`).join(''):'<div class="empty" style="padding:16px">Sin depositos</div>';

function setChartMode(m,btn){chartMode=m;['cht-tot','cht-des'].forEach(id=>{document.getElementById(id).style.borderColor='';document.getElementById(id).style.color='';});btn.style.borderColor='var(--accent)';btn.style.color='var(--accent2)';renderAhorrosChart();}
function renderAhorrosChart(){
  const ctx=document.getElementById('achrt');if(!ctx)return;
  if(chartA)chartA.destroy();
  const mls=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);mls.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
  const tc=darkMode?'#9090a8':'#5a5a72',gc=darkMode?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)';
  const baseOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tc,font:{family:'Poppins',size:10},boxWidth:8,padding:8}}},scales:{y:{ticks:{color:tc,font:{family:'Poppins',size:9},callback:v=>'$'+Math.round(v/1000)+'k'},grid:{color:gc}},x:{ticks:{color:tc,font:{family:'Poppins',size:9}},grid:{color:gc}}}};
  const labels=mls.map(m=>mesLabel(m).split(' ')[0]);
  if(chartMode==='total'){
    let ac=0;const data=mls.map(m=>{ac+=ahorros.filter(a=>a.fecha?.startsWith(m)).reduce((s,a)=>s+a.monto,0);return ac;});
    chartA=new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Total ahorrado',data,borderColor:'#7c6dfa',backgroundColor:'rgba(124,109,250,0.08)',fill:true,tension:0.4,pointBackgroundColor:'#7c6dfa',pointRadius:3}]},options:baseOpts});
  } else {
    const bmap={};ahorros.forEach(a=>{if(!bmap[a.billetera])bmap[a.billetera]={color:a.color||'#7c6dfa',items:[]};bmap[a.billetera].items.push(a);});
    const datasets=Object.entries(bmap).map(([b,{color,items}])=>{let ac=0;const data=mls.map(m=>{ac+=items.filter(a=>a.fecha?.startsWith(m)).reduce((s,a)=>s+a.monto,0);return ac;});return{label:b,data,borderColor:color,backgroundColor:'transparent',tension:0.4,pointBackgroundColor:color,pointRadius:3};});
    chartA=new Chart(ctx,{type:'line',data:{labels,datasets},options:baseOpts});
  }
}

// RENDER PRESTAMOS
function renderPrestamos(){
  ['mlabel3'].forEach(id=>document.getElementById(id).textContent=mesLabel(curMes));
  const el=document.getElementById('prest-lista');
  if(!prestamos.length){el.innerHTML='<div class="empty">Sin prestamos registrados</div>';return;}
  el.innerHTML=prestamos.map(p=>{
    const inicio=new Date(p.fecha_inicio+'T12:00:00');
    const ahora=new Date(curMes+'-15T12:00:00');
    const mesesTransc=Math.max(0,Math.round((ahora-inicio)/(1000*60*60*24*30)));
    const cuotaActual=Math.min(mesesTransc+1,p.cuotas_total);
    const saldado=cuotaActual>=p.cuotas_total&&isPagado('prest-'+p.id);
    const atrasado=!isPagado('prest-'+p.id)&&mesesTransc>0;
    const prog=Math.round((cuotaActual/p.cuotas_total)*100);
    return `<div class="prest-card">
      <div class="prest-header">
        <div><div class="prest-nombre">${p.nombre}</div>${p.descripcion?`<div class="prest-desc">${p.descripcion}</div>`:''}</div>
        <button class="bdel" onclick="eliminarPrestamo(${p.id})">×</button>
      </div>
      <div class="prest-cuota">${fmt(p.monto_cuota)} / cuota &nbsp;·&nbsp; Cuota ${cuotaActual}/${p.cuotas_total}</div>
      <div class="prest-prog"><div class="pb" style="margin-top:6px"><div class="pf" style="width:${prog}%;background:${prog>=100?'#3ecf8e':'#7c6dfa'}"></div></div></div>
      ${saldado?`<div class="prest-saldado">Prestamo saldado</div>`:''}
      ${atrasado&&!saldado?`<div class="prest-atrasado">Cuota de ${mesLabel(curMes)} pendiente de confirmacion</div>`:''}
      <div style="margin-top:10px"><div class="chk-item" onclick="togglePago('prest-${p.id}')">
        <div class="chk-box${isPagado('prest-'+p.id)?' done':''}"></div>
        <span class="chk-label${isPagado('prest-'+p.id)?' done':''}">Cuota ${cuotaActual} pagada</span>
        <span class="chk-monto">${fmt(p.monto_cuota)}</span>
      </div></div>
    </div>`;
  }).join('');
}

// IA
function buildCtx(){
  const gm=movDelMes(),gastosM=gm.filter(m=>m.tipo!=='ingreso'),ingrM=gm.filter(m=>m.tipo==='ingreso');
  const ingrExtra=ingrM.reduce((a,b)=>a+b.monto,0),ingrTotal=cfg.sueldo+ingrExtra;
  const alqArs=cfg.alqUsd*cfg.tc,totalViv=alqArs+cfg.exp;
  const gc=g=>gastosM.filter(x=>x.categoria===g).reduce((a,b)=>a+b.monto,0);
  const gastAho=ahorros.filter(a=>a.fecha?.startsWith(curMes)).reduce((a,b)=>a+b.monto,0);
  const totalAho=ahorros.reduce((a,b)=>a+b.monto,0);
  const bmap={};ahorros.forEach(a=>{bmap[a.billetera]=(bmap[a.billetera]||0)+a.monto;});
  const prestAtras=prestamos.filter(p=>p.activo&&!isPagado('prest-'+p.id));
  return `Eres asistente financiero personal. Responde en espanol rioplatense, maximo 4 oraciones concisas.
Mes: ${mesLabel(curMes)} | Sueldo: ${fmt(cfg.sueldo)} | Ingresos extra: ${fmt(ingrExtra)} | Total: ${fmt(ingrTotal)}
Regla ${cfg.nec}/${cfg.des}/${cfg.aho}: Nec presup ${fmt(ingrTotal*cfg.nec/100)} gastado ${fmt(totalViv+gc('casa'))} | Des presup ${fmt(ingrTotal*cfg.des/100)} gastado ${fmt(gc('pareja')+gc('personal'))} | Aho presup ${fmt(ingrTotal*cfg.aho/100)} ahorrado ${fmt(gastAho)}
Total ahorrado historico: ${fmt(totalAho)} | Por billetera: ${Object.entries(bmap).map(([k,v])=>k+': '+fmt(v)).join(', ')||'sin registros'}
Prestamos activos: ${prestamos.filter(p=>p.activo).length} | Atrasados este mes: ${prestAtras.map(p=>p.nombre).join(', ')||'ninguno'}`;
}
async function sendChat(){
  const inp=document.getElementById('cinput'),msg=inp.value.trim();if(!msg)return;
  inp.value='';addMsg(msg,'u');const th=addMsg('Analizando...','a th');
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEM_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:buildCtx()+'\n\nPregunta: '+msg}]}]})});
    const d=await r.json();const t=d.candidates?.[0]?.content?.parts?.[0]?.text||'Sin respuesta.';
    th.className='cm a';th.textContent=t;
  }catch(e){th.className='cm a';th.textContent='Error de conexion.';}
  document.getElementById('chat-msgs').scrollTop=9999;
}
function qa(q){document.getElementById('cinput').value=q;sendChat();}
function addMsg(t,c){const el=document.createElement('div');el.className='cm '+c;el.textContent=t;const w=document.getElementById('chat-msgs');w.appendChild(el);w.scrollTop=9999;return el;}

// PDF
function genPDF(){
  const{jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const gm=movDelMes(),gastosM=gm.filter(m=>m.tipo!=='ingreso');
  const ingrExtra=gm.filter(m=>m.tipo==='ingreso').reduce((a,b)=>a+b.monto,0),ingrTotal=cfg.sueldo+ingrExtra;
  const alqArs=cfg.alqUsd*cfg.tc,totalViv=alqArs+cfg.exp;
  const gc=g=>gastosM.filter(x=>x.categoria===g).reduce((a,b)=>a+b.monto,0);
  const gastAho=ahorros.filter(a=>a.fecha?.startsWith(curMes)).reduce((a,b)=>a+b.monto,0);
  const gastNec=totalViv+gc('casa'),gastDes=gc('pareja')+gc('personal'),totalGast=gastNec+gastDes+gastAho;

  doc.setFillColor(15,15,19);doc.rect(0,0,210,297,'F');
  doc.setFillColor(124,109,250);doc.rect(0,0,210,20,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text('fin. Finanzas Personales',14,13);
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text(mesLabel(curMes).toUpperCase(),160,13);

  let y=28;
  doc.setTextColor(144,144,168);doc.setFontSize(8);doc.text('BALANCE',14,y);y+=5;
  [[fmt(ingrTotal),'Ingresos'],[fmt(totalGast),'Gastado'],[fmt(Math.max(0,ingrTotal-totalGast)),'Disponible']].forEach(([v,l],i)=>{
    const x=14+i*62;doc.setFillColor(30,30,39);doc.roundedRect(x,y,58,16,2,2,'F');
    doc.setTextColor(144,144,168);doc.setFontSize(7);doc.text(l,x+4,y+6);doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text(v,x+4,y+13);doc.setFont('helvetica','normal');
  });

  y+=24;doc.setTextColor(144,144,168);doc.setFontSize(8);doc.text('DISTRIBUCION',14,y);y+=5;
  [{l:'Necesidades',p:ingrTotal*cfg.nec/100,g:gastNec},{l:'Deseos',p:ingrTotal*cfg.des/100,g:gastDes},{l:'Ahorro',p:ingrTotal*cfg.aho/100,g:gastAho}].forEach(({l,p,g})=>{
    const pc=Math.min(100,p>0?g/p*100:0),col=pc<70?[62,207,142]:pc<90?[245,158,11]:[248,113,113];
    doc.setFillColor(30,30,39);doc.roundedRect(14,y,182,12,2,2,'F');
    if(pc>0){doc.setFillColor(...col);doc.roundedRect(14,y,Math.max(3,182*pc/100),12,2,2,'F');}
    doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont('helvetica','bold');doc.text(l,18,y+8);doc.setFont('helvetica','normal');doc.text(fmt(g)+' / '+fmt(p),140,y+8);y+=16;
  });

  y+=2;doc.setTextColor(144,144,168);doc.setFontSize(8);doc.text('CATEGORIAS',14,y);y+=2;
  doc.autoTable({startY:y,theme:'plain',styles:{font:'helvetica',fontSize:9,textColor:[240,240,245],cellPadding:3},headStyles:{textColor:[144,144,168],fontSize:7,fontStyle:'normal'},head:[['Categoria','Monto']],body:[['Tarjeta Casa',fmt(gc('casa'))],['Tarjeta Pareja',fmt(gc('pareja'))],['Tarjeta Personal',fmt(gc('personal'))],['Alquiler + Expensas',fmt(totalViv)],['Ahorro',fmt(gastAho)]],alternateRowStyles:{fillColor:[22,22,28]},tableLineColor:[40,40,52],tableLineWidth:0.1,margin:{left:14,right:14}});

  if(gm.length>0){
    y=doc.lastAutoTable.finalY+8;doc.setTextColor(144,144,168);doc.setFontSize(8);doc.text('MOVIMIENTOS',14,y);y+=2;
    const cl={casa:'T.Casa',pareja:'T.Pareja',personal:'T.Personal',alquiler:'Alquiler',otro:'Otro',sueldo:'Sueldo',freelance:'Freelance',venta:'Venta'};
    doc.autoTable({startY:y,theme:'plain',styles:{font:'helvetica',fontSize:8,textColor:[240,240,245],cellPadding:3},headStyles:{textColor:[144,144,168],fontSize:7},head:[['Fecha','Descripcion','Tipo','Monto']],body:gm.map(g=>[g.fecha,(g.descripcion||'').substring(0,26),cl[g.categoria]||g.categoria,(g.tipo==='ingreso'?'+':'')+fmt(g.monto)]),alternateRowStyles:{fillColor:[22,22,28]},tableLineColor:[40,40,52],tableLineWidth:0.1,margin:{left:14,right:14},columnStyles:{0:{cellWidth:22},3:{halign:'right',cellWidth:28}}});
  }

  doc.setTextColor(90,90,114);doc.setFontSize(7);doc.text('fin. app finanzas personales',14,290);doc.text(new Date().toLocaleDateString('es-AR'),170,290);
  doc.save('finanzas-'+curMes+'.pdf');toast('PDF descargado');
}

// UI
function sp(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');if(btn)btn.classList.add('active');
  if(name==='resumen')renderResumen();
  if(name==='historial')renderHistorial();
  if(name==='ahorros')renderAhorros();
  if(name==='prestamos')renderPrestamos();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
