<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas Personales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f13;
  --bg2: #16161c;
  --bg3: #1e1e27;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0f0f5;
  --text2: #9090a8;
  --text3: #5a5a72;
  --accent: #7c6dfa;
  --accent2: #a594fb;
  --green: #3ecf8e;
  --amber: #f59e0b;
  --red: #f87171;
  --teal: #2dd4bf;
  --radius: 12px;
  --radius-sm: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:400px}
.auth-logo{font-size:28px;font-weight:600;margin-bottom:8px;color:var(--text)}
.auth-logo span{color:var(--accent2)}
.auth-sub{font-size:13px;color:var(--text2);margin-bottom:32px}
.auth-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:var(--radius-sm);padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;border:none;background:none;color:var(--text2);cursor:pointer;border-radius:6px;transition:all .2s}
.auth-tab.active{background:var(--bg2);color:var(--text)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.form-group input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .2s}
.form-group input:focus{border-color:var(--accent)}
.btn-primary{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;transition:opacity .2s;font-family:inherit}
.btn-primary:hover{opacity:.85}
.auth-msg{font-size:13px;text-align:center;margin-top:12px;color:var(--text2)}
.auth-msg.error{color:var(--red)}
.auth-msg.success{color:var(--green)}

/* APP */
#app{display:none;min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:80px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0}
.topbar-title{font-size:18px;font-weight:600}
.topbar-user{font-size:12px;color:var(--text2)}
.btn-logout{background:none;border:1px solid var(--border2);color:var(--text2);padding:6px 12px;border-radius:var(--radius-sm);font-size:12px;cursor:pointer;font-family:inherit}
.btn-logout:hover{color:var(--red);border-color:var(--red)}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;padding:12px 4px 16px;background:none;border:none;color:var(--text3);font-size:10px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;transition:color .2s}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--accent2)}

/* PAGES */
.page{display:none;padding:16px 20px}
.page.active{display:block}
.section-label{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:14px}

/* METRIC GRID */
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.metric-label{font-size:11px;color:var(--text3);margin-bottom:6px}
.metric-value{font-size:18px;font-weight:600;font-family:'DM Mono',monospace}
.metric-value.ok{color:var(--green)}.metric-value.warn{color:var(--amber)}.metric-value.bad{color:var(--red)}

/* PROGRESS */
.prog-wrap{margin-bottom:14px}
.prog-header{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.prog-label{color:var(--text2)}
.prog-nums{color:var(--text);font-family:'DM Mono',monospace;font-size:12px}
.prog-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}

/* ROWS */
.row-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.row-item:last-child{border-bottom:none}
.row-left{font-size:14px;color:var(--text2)}
.row-right{font-size:14px;font-weight:500;font-family:'DM Mono',monospace}

/* FORM */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.field input,.field select{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .2s}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field select option{background:var(--bg2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-save{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:4px;transition:opacity .2s}
.btn-save:hover{opacity:.85}
.btn-sec{width:100%;padding:11px;background:none;color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:8px;transition:all .2s}
.btn-sec:hover{color:var(--text);border-color:var(--border2)}

/* RANGE */
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1;accent-color:var(--accent)}
.range-val{font-size:13px;font-family:'DM Mono',monospace;color:var(--accent2);min-width:32px;text-align:right}

/* GASTO ITEMS */
.gasto-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start}
.gasto-info{}
.gasto-desc{font-size:14px;font-weight:500;margin-bottom:4px}
.gasto-meta{font-size:12px;color:var(--text3)}
.gasto-right{text-align:right}
.gasto-monto{font-size:15px;font-weight:600;font-family:'DM Mono',monospace;margin-bottom:6px}
.btn-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;transition:color .2s}
.btn-del:hover{color:var(--red)}

/* BADGE */
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.badge-green{background:rgba(62,207,142,.15);color:var(--green)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-red{background:rgba(248,113,113,.15);color:var(--red)}
.badge-purple{background:rgba(124,109,250,.15);color:var(--accent2)}

/* ALERT */
.alert{padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px}
.alert-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--amber)}
.alert-ok{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3);color:var(--green)}

/* AI CHAT */
.chat-wrap{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;max-height:320px;overflow-y:auto;padding-right:4px}
.chat-msg{padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.6;max-width:90%}
.chat-msg.user{background:var(--accent);color:#fff;align-self:flex-end;margin-left:auto}
.chat-msg.ai{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.chat-msg.thinking{color:var(--text3);font-style:italic}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1;padding:10px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;outline:none}
.chat-input-row input:focus{border-color:var(--accent)}
.btn-send{padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500}
.quick-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.quick-btn{padding:6px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s}
.quick-btn:hover{border-color:var(--accent);color:var(--accent2)}

/* PDF BTN */
.btn-pdf{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px}
.btn-pdf:hover{border-color:var(--teal);color:var(--teal)}

.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.month-selector{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.month-nav{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);padding:6px 12px;cursor:pointer;font-size:18px;line-height:1}
.month-nav:hover{color:var(--text);border-color:var(--border2)}
.month-label{font-size:16px;font-weight:500}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 20px;border-radius:var(--radius);font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">fin<span>.</span></div>
    <div class="auth-sub">Tu administrador de finanzas personales</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Iniciar sesión</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">Registrarse</button>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="tu@email.com">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="auth-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doAuth()">
    </div>
    <button class="btn-primary" onclick="doAuth()" id="auth-btn">Iniciar sesión</button>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div>
      <div class="topbar-title">fin<span style="color:var(--accent2)">.</span></div>
      <div class="topbar-user" id="user-email"></div>
    </div>
    <button class="btn-logout" onclick="logout()">Salir</button>
  </div>

  <!-- RESUMEN -->
  <div id="page-resumen" class="page active">
    <div style="margin-top:16px">
      <div class="month-selector">
        <button class="month-nav" onclick="changeMonth(-1)">‹</button>
        <span class="month-label" id="month-label"></span>
        <button class="month-nav" onclick="changeMonth(1)">›</button>
      </div>
      <div id="resumen-content"></div>
    </div>
  </div>

  <!-- REGISTRAR -->
  <div id="page-gastos" class="page">
    <div style="margin-top:16px">
      <div class="card">
        <div class="card-title">Registrar gasto</div>
        <div class="field">
          <label>Descripción</label>
          <input type="text" id="g-desc" placeholder="ej: supermercado, nafta...">
        </div>
        <div class="field">
          <label>Monto ($ARS)</label>
          <input type="number" id="g-monto" placeholder="0">
        </div>
        <div class="two-col">
          <div class="field">
            <label>Categoría</label>
            <select id="g-cat">
              <option value="casa">🏠 Tarjeta Casa</option>
              <option value="pareja">💑 Tarjeta Pareja</option>
              <option value="personal">👤 Tarjeta Personal</option>
              <option value="alquiler">🔑 Alquiler/Expensas</option>
              <option value="ahorro">💰 Ahorro</option>
              <option value="otro">📦 Otro</option>
            </select>
          </div>
          <div class="field">
            <label>Fecha</label>
            <input type="date" id="g-fecha">
          </div>
        </div>
        <button class="btn-save" onclick="agregarGasto()" id="btn-agregar">Guardar gasto</button>
      </div>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div id="page-historial" class="page">
    <div style="margin-top:16px">
      <div class="month-selector">
        <button class="month-nav" onclick="changeMonth(-1)">‹</button>
        <span class="month-label" id="month-label2"></span>
        <button class="month-nav" onclick="changeMonth(1)">›</button>
      </div>
      <div id="historial-content"></div>
    </div>
  </div>

  <!-- IA -->
  <div id="page-ia" class="page">
    <div style="margin-top:16px">
      <div class="card">
        <div class="card-title">Consultas rápidas</div>
        <div class="quick-btns">
          <button class="quick-btn" onclick="quickAsk('¿En qué categoría gasté más este mes?')">¿Dónde gasté más?</button>
          <button class="quick-btn" onclick="quickAsk('¿Cómo puedo reducir mis gastos este mes?')">Cómo reducir gastos</button>
          <button class="quick-btn" onclick="quickAsk('¿Estoy cumpliendo la regla 50/30/20?')">Estado 50/30/20</button>
          <button class="quick-btn" onclick="quickAsk('¿Cuánto me queda disponible para gastar?')">¿Cuánto me queda?</button>
        </div>
        <div class="chat-wrap" id="chat-messages">
          <div class="chat-msg ai">¡Hola! Soy tu asistente financiero. Puedo analizar tus gastos y ayudarte a tomar mejores decisiones. ¿En qué te ayudo?</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Preguntame algo sobre tus finanzas..." onkeydown="if(event.key==='Enter')sendChat()">
          <button class="btn-send" onclick="sendChat()">→</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CONFIG -->
  <div id="page-config" class="page">
    <div style="margin-top:16px">
      <div class="card">
        <div class="card-title">Ingresos</div>
        <div class="field">
          <label>Sueldo mensual neto ($ARS)</label>
          <input type="number" id="c-sueldo" placeholder="2200000">
        </div>
      </div>
      <div class="card">
        <div class="card-title">Regla de distribución</div>
        <div class="field">
          <label>Necesidades — <span id="lbl-nec">50</span>%</label>
          <div class="range-row"><input type="range" min="20" max="80" value="50" id="r-nec" oninput="syncRanges('nec')"><span class="range-val" id="rv-nec">50%</span></div>
        </div>
        <div class="field">
          <label>Deseos — <span id="lbl-des">30</span>%</label>
          <div class="range-row"><input type="range" min="10" max="60" value="30" id="r-des" oninput="syncRanges('des')"><span class="range-val" id="rv-des">30%</span></div>
        </div>
        <div class="field">
          <label>Ahorro — <span id="lbl-aho">20</span>% (calculado)</label>
          <div style="padding:10px 12px;background:var(--bg3);border-radius:var(--radius-sm);font-size:14px;color:var(--text3)" id="aho-info">20%</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Vivienda</div>
        <div class="two-col">
          <div class="field">
            <label>Alquiler (USD)</label>
            <input type="number" id="c-alq" placeholder="ej: 400" oninput="updateAlqInfo()">
          </div>
          <div class="field">
            <label>Tipo de cambio</label>
            <input type="number" id="c-tc" placeholder="ej: 1200" oninput="updateAlqInfo()">
          </div>
        </div>
        <div class="field">
          <label>Expensas ($ARS)</label>
          <input type="number" id="c-exp" placeholder="ej: 85000" oninput="updateAlqInfo()">
        </div>
        <div style="font-size:12px;color:var(--text3);margin-top:4px" id="alq-info"></div>
      </div>
      <button class="btn-save" onclick="guardarConfig()">Guardar configuración</button>
      <button class="btn-pdf" onclick="generarPDF()">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        Descargar resumen PDF
      </button>
    </div>
  </div>

  <!-- NAV -->
  <nav class="nav">
    <button class="nav-btn active" onclick="showPage('resumen',this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Resumen
    </button>
    <button class="nav-btn" onclick="showPage('gastos',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Registrar
    </button>
    <button class="nav-btn" onclick="showPage('historial',this)">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Historial
    </button>
    <button class="nav-btn" onclick="showPage('ia',this)">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      IA
    </button>
    <button class="nav-btn" onclick="showPage('config',this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Config
    </button>
  </nav>
</div>

<div id="toast"></div>

<script>
// ─── CONFIGURACIÓN ───────────────────────────────────────────────
const SUPABASE_URL = 'https://vhnqbdxigbxctdctlflc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9G6kgMR0TGb3VLYatdAVjA_JcC2Qsqt';
const GEMINI_KEY = 'AIzaSyBE2vMCY-NuUZVKGtumtBrfd3PhHK4Rg70';

// ─── ESTADO ──────────────────────────────────────────────────────
let currentUser = null;
let cfg = {sueldo:2200000,nec:50,des:30,aho:20,alqUsd:0,tc:1200,exp:0};
let gastos = [];
let currentMonth = new Date().toISOString().slice(0,7);
let authMode = 'login';

// ─── SUPABASE HELPERS ────────────────────────────────────────────
const sb = async (path, method='GET', body=null, token=null) => {
  const headers = {'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+(token||SUPABASE_KEY)};
  const opts = {method,headers};
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(SUPABASE_URL+path, opts);
  const text = await r.text();
  try { return {ok:r.ok, status:r.status, data:JSON.parse(text)}; }
  catch(e) { return {ok:r.ok, status:r.status, data:text}; }
};

const sbAuth = async (endpoint, email, pass) => {
  const r = await fetch(SUPABASE_URL+'/auth/v1/'+endpoint, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
    body:JSON.stringify({email,password:pass})
  });
  return await r.json();
};

// ─── AUTH ────────────────────────────────────────────────────────
function switchAuthTab(mode){
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(mode==='login'?i===0:i===1)));
  document.getElementById('auth-btn').textContent = mode==='login'?'Iniciar sesión':'Crear cuenta';
  document.getElementById('auth-msg').textContent='';
}

async function doAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const msg = document.getElementById('auth-msg');
  if(!email||!pass){msg.textContent='Completá email y contraseña';msg.className='auth-msg error';return;}
  document.getElementById('auth-btn').innerHTML='<span class="spinner"></span>Cargando...';
  const endpoint = authMode==='login'?'token?grant_type=password':'signup';
  const res = await sbAuth(endpoint, email, pass);
  document.getElementById('auth-btn').textContent = authMode==='login'?'Iniciar sesión':'Crear cuenta';
  if(res.access_token){
    currentUser = {token:res.access_token, email:res.user.email, id:res.user.id};
    sessionStorage.setItem('fin_user', JSON.stringify(currentUser));
    initApp();
  } else if(authMode==='register' && res.id){
    msg.textContent='¡Cuenta creada! Ya podés iniciar sesión.';msg.className='auth-msg success';switchAuthTab('login');
  } else {
    msg.textContent=res.error_description||res.msg||'Error al autenticar';msg.className='auth-msg error';
  }
}

async function logout(){
  sessionStorage.removeItem('fin_user');
  currentUser=null;gastos=[];
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
}

// ─── INIT ────────────────────────────────────────────────────────
async function initApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('user-email').textContent=currentUser.email;
  document.getElementById('g-fecha').value=new Date().toISOString().slice(0,10);
  await cargarConfig();
  await cargarGastos();
  renderResumen();
  renderHistorial();
  initConfigUI();
}

// ─── CONFIG ──────────────────────────────────────────────────────
async function cargarConfig(){
  const r = await sb('/rest/v1/configuracion?user_id=eq.'+currentUser.id,'GET',null,currentUser.token);
  if(r.ok && r.data.length>0){
    const d=r.data[0];
    cfg={sueldo:+d.sueldo,nec:+d.nec,des:+d.des,aho:+d.aho,alqUsd:+d.alq_usd,tc:+d.tipo_cambio,exp:+d.expensas};
  }
}

async function guardarConfig(){
  cfg.sueldo=+document.getElementById('c-sueldo').value||cfg.sueldo;
  cfg.alqUsd=+document.getElementById('c-alq').value||0;
  cfg.tc=+document.getElementById('c-tc').value||1200;
  cfg.exp=+document.getElementById('c-exp').value||0;
  const payload={user_id:currentUser.id,sueldo:cfg.sueldo,nec:cfg.nec,des:cfg.des,aho:cfg.aho,alq_usd:cfg.alqUsd,tipo_cambio:cfg.tc,expensas:cfg.exp};
  await sb('/rest/v1/configuracion','POST',payload,currentUser.token);
  await sb('/rest/v1/configuracion?user_id=eq.'+currentUser.id,'PATCH',payload,currentUser.token);
  toast('Configuración guardada ✓');
  renderResumen();
}

function initConfigUI(){
  document.getElementById('c-sueldo').value=cfg.sueldo;
  document.getElementById('r-nec').value=cfg.nec;
  document.getElementById('r-des').value=cfg.des;
  document.getElementById('c-alq').value=cfg.alqUsd||'';
  document.getElementById('c-tc').value=cfg.tc||'';
  document.getElementById('c-exp').value=cfg.exp||'';
  document.getElementById('lbl-nec').textContent=cfg.nec;
  document.getElementById('lbl-des').textContent=cfg.des;
  document.getElementById('lbl-aho').textContent=cfg.aho;
  document.getElementById('rv-nec').textContent=cfg.nec+'%';
  document.getElementById('rv-des').textContent=cfg.des+'%';
  updateAhoInfo();updateAlqInfo();
}

function syncRanges(changed){
  let nec=+document.getElementById('r-nec').value;
  let des=+document.getElementById('r-des').value;
  if(nec+des>90){if(changed==='nec')des=90-nec;else nec=90-des;}
  document.getElementById('r-nec').value=nec;
  document.getElementById('r-des').value=des;
  const aho=100-nec-des;
  cfg.nec=nec;cfg.des=des;cfg.aho=aho;
  document.getElementById('lbl-nec').textContent=nec;
  document.getElementById('lbl-des').textContent=des;
  document.getElementById('lbl-aho').textContent=aho;
  document.getElementById('rv-nec').textContent=nec+'%';
  document.getElementById('rv-des').textContent=des+'%';
  updateAhoInfo();
}

function updateAhoInfo(){
  const s=+document.getElementById('c-sueldo').value||cfg.sueldo;
  document.getElementById('aho-info').textContent=cfg.aho+'% → '+fmt(s*cfg.aho/100)+' / mes';
}

function updateAlqInfo(){
  const usd=+document.getElementById('c-alq').value||0;
  const tc=+document.getElementById('c-tc').value||0;
  const exp=+document.getElementById('c-exp').value||0;
  const total=usd*tc+exp;
  document.getElementById('alq-info').textContent=total>0?'Total vivienda: '+fmt(total)+' ARS':'';
}

// ─── GASTOS ──────────────────────────────────────────────────────
async function cargarGastos(){
  const r=await sb('/rest/v1/gastos?user_id=eq.'+currentUser.id+'&order=fecha.desc,created_at.desc','GET',null,currentUser.token);
  if(r.ok) gastos=r.data||[];
}

async function agregarGasto(){
  const desc=document.getElementById('g-desc').value.trim();
  const monto=+document.getElementById('g-monto').value;
  const cat=document.getElementById('g-cat').value;
  const fecha=document.getElementById('g-fecha').value;
  if(!desc||!monto){toast('Completá descripción y monto');return;}
  const btn=document.getElementById('btn-agregar');
  btn.innerHTML='<span class="spinner"></span>Guardando...';
  const payload={user_id:currentUser.id,descripcion:desc,monto,categoria:cat,fecha};
  const r=await sb('/rest/v1/gastos','POST',payload,currentUser.token);
  if(r.ok||r.status===201){
    gastos.unshift({...payload,id:Date.now()});
    document.getElementById('g-desc').value='';
    document.getElementById('g-monto').value='';
    toast('Gasto guardado ✓');
    renderResumen();
    renderHistorial();
  } else { toast('Error al guardar'); }
  btn.textContent='Guardar gasto';
}

async function eliminarGasto(id){
  await sb('/rest/v1/gastos?id=eq.'+id,'DELETE',null,currentUser.token);
  gastos=gastos.filter(g=>g.id!==id);
  renderResumen();renderHistorial();
  toast('Gasto eliminado');
}

// ─── RENDER ──────────────────────────────────────────────────────
const fmt = v=>'$'+Math.round(v).toLocaleString('es-AR');
const pct = (a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function monthLabel(ym){
  const [y,m]=ym.split('-');
  return meses[+m-1]+' '+y;
}

function changeMonth(dir){
  const [y,m]=currentMonth.split('-').map(Number);
  const d=new Date(y,m-1+dir,1);
  currentMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  renderResumen();renderHistorial();
}

function gastosDelMes(){
  return gastos.filter(g=>g.fecha&&g.fecha.startsWith(currentMonth));
}

function renderResumen(){
  document.getElementById('month-label').textContent=monthLabel(currentMonth);
  const gm=gastosDelMes();
  const alqArs=cfg.alqUsd*cfg.tc;
  const totalViv=alqArs+cfg.exp;
  const presNec=cfg.sueldo*cfg.nec/100;
  const presDes=cfg.sueldo*cfg.des/100;
  const presAho=cfg.sueldo*cfg.aho/100;
  const catBucket={casa:'nec',pareja:'des',personal:'des',alquiler:'nec',ahorro:'aho',otro:'des'};
  let gastNec=totalViv+gm.filter(g=>catBucket[g.categoria]==='nec'&&g.categoria!=='alquiler').reduce((a,b)=>a+b.monto,0);
  let gastDes=gm.filter(g=>catBucket[g.categoria]==='des').reduce((a,b)=>a+b.monto,0);
  let gastAho=gm.filter(g=>g.categoria==='ahorro').reduce((a,b)=>a+b.monto,0);
  const gastCasa=gm.filter(g=>g.categoria==='casa').reduce((a,b)=>a+b.monto,0);
  const gastPar=gm.filter(g=>g.categoria==='pareja').reduce((a,b)=>a+b.monto,0);
  const gastPers=gm.filter(g=>g.categoria==='personal').reduce((a,b)=>a+b.monto,0);
  const totalGast=gastNec+gastDes+gastAho;
  const sobrante=cfg.sueldo-totalGast;
  const sobrOk=sobrante>=0;

  const barColor=(g,p)=>{const r=pct(g,p);return r<70?'var(--green)':r<90?'var(--amber)':'var(--red)';};

  document.getElementById('resumen-content').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="font-size:13px;color:var(--text2)">${gm.length} movimientos</span>
      <span class="badge ${sobrOk?'badge-green':'badge-red'}">${sobrOk?'En presupuesto':'Excedido'}</span>
    </div>
    ${!sobrOk?`<div class="alert alert-warn">Excediste el presupuesto en ${fmt(Math.abs(sobrante))}</div>`:''}
    <div class="metric-grid">
      <div class="metric"><div class="metric-label">Ingresos</div><div class="metric-value" style="color:var(--text)">${fmt(cfg.sueldo)}</div></div>
      <div class="metric"><div class="metric-label">Gastado</div><div class="metric-value ${sobrOk?'ok':'bad'}">${fmt(totalGast)}</div></div>
      <div class="metric"><div class="metric-label">Disponible</div><div class="metric-value ${sobrOk?'ok':'bad'}">${fmt(Math.max(0,sobrante))}</div></div>
    </div>
    <div class="card">
      <div class="card-title">Regla ${cfg.nec}/${cfg.des}/${cfg.aho}</div>
      ${[
        {label:`Necesidades (${cfg.nec}%)`,pres:presNec,gast:gastNec},
        {label:`Deseos (${cfg.des}%)`,pres:presDes,gast:gastDes},
        {label:`Ahorro (${cfg.aho}%)`,pres:presAho,gast:gastAho}
      ].map(({label,pres,gast})=>{
        const p=pct(gast,pres);const col=barColor(gast,pres);
        return `<div class="prog-wrap">
          <div class="prog-header"><span class="prog-label">${label}</span><span class="prog-nums">${fmt(gast)} / ${fmt(pres)}</span></div>
          <div class="prog-bar"><div class="prog-fill" style="width:${p}%;background:${col}"></div></div>
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <div class="card-title">Por tarjeta</div>
      ${[
        {label:'Tarjeta Casa 🏠',val:gastCasa},
        {label:'Tarjeta Pareja 💑',val:gastPar},
        {label:'Tarjeta Personal 👤',val:gastPers},
        {label:'Alquiler + Expensas 🔑',val:totalViv}
      ].map(({label,val})=>`<div class="row-item"><span class="row-left">${label}</span><span class="row-right">${fmt(val)}</span></div>`).join('')}
    </div>`;
}

function renderHistorial(){
  document.getElementById('month-label2').textContent=monthLabel(currentMonth);
  const gm=gastosDelMes();
  const el=document.getElementById('historial-content');
  if(gm.length===0){el.innerHTML='<div class="empty">Sin gastos en este mes</div>';return;}
  const catLabel={casa:'Tarjeta Casa',pareja:'Tarjeta Pareja',personal:'Tarjeta Personal',alquiler:'Alquiler/Expensas',ahorro:'Ahorro',otro:'Otro'};
  el.innerHTML=gm.map(g=>`
    <div class="gasto-card">
      <div class="gasto-info">
        <div class="gasto-desc">${g.descripcion}</div>
        <div class="gasto-meta">${catLabel[g.categoria]||g.categoria} · ${g.fecha}</div>
      </div>
      <div class="gasto-right">
        <div class="gasto-monto">${fmt(g.monto)}</div>
        <button class="btn-del" onclick="eliminarGasto(${g.id})">×</button>
      </div>
    </div>`).join('');
}

// ─── IA ──────────────────────────────────────────────────────────
function buildContext(){
  const gm=gastosDelMes();
  const alqArs=cfg.alqUsd*cfg.tc;
  const totalViv=alqArs+cfg.exp;
  const gastCasa=gm.filter(g=>g.categoria==='casa').reduce((a,b)=>a+b.monto,0);
  const gastPar=gm.filter(g=>g.categoria==='pareja').reduce((a,b)=>a+b.monto,0);
  const gastPers=gm.filter(g=>g.categoria==='personal').reduce((a,b)=>a+b.monto,0);
  const gastAho=gm.filter(g=>g.categoria==='ahorro').reduce((a,b)=>a+b.monto,0);
  const presNec=cfg.sueldo*cfg.nec/100;
  const presDes=cfg.sueldo*cfg.des/100;
  const presAho=cfg.sueldo*cfg.aho/100;
  return `Sos un asistente financiero personal. Responde en español, de forma concisa y útil (máximo 3-4 oraciones).
Datos del usuario para ${monthLabel(currentMonth)}:
- Sueldo: $${cfg.sueldo.toLocaleString('es-AR')} ARS
- Regla: ${cfg.nec}% necesidades / ${cfg.des}% deseos / ${cfg.aho}% ahorro
- Presupuesto necesidades: $${Math.round(presNec).toLocaleString('es-AR')} | gastado: $${Math.round(totalViv+gastCasa).toLocaleString('es-AR')}
- Presupuesto deseos: $${Math.round(presDes).toLocaleString('es-AR')} | gastado: $${Math.round(gastPar+gastPers).toLocaleString('es-AR')}
- Presupuesto ahorro: $${Math.round(presAho).toLocaleString('es-AR')} | ahorrado: $${Math.round(gastAho).toLocaleString('es-AR')}
- Vivienda (alquiler+expensas): $${Math.round(totalViv).toLocaleString('es-AR')}
- Tarjeta Casa: $${Math.round(gastCasa).toLocaleString('es-AR')}
- Tarjeta Pareja: $${Math.round(gastPar).toLocaleString('es-AR')}
- Tarjeta Personal: $${Math.round(gastPers).toLocaleString('es-AR')}
- Gastos registrados este mes: ${gm.length}`;
}

async function sendChat(){
  const input=document.getElementById('chat-input');
  const msg=input.value.trim();
  if(!msg) return;
  input.value='';
  addChatMsg(msg,'user');
  const thinking=addChatMsg('Analizando tus finanzas...','ai thinking');
  try {
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:buildContext()+'\n\nPregunta del usuario: '+msg}]}]})
    });
    const d=await r.json();
    const text=d.candidates?.[0]?.content?.parts?.[0]?.text||'No pude obtener respuesta.';
    thinking.className='chat-msg ai';
    thinking.textContent=text;
  } catch(e){
    thinking.className='chat-msg ai';
    thinking.textContent='Error al conectar con la IA. Verificá tu conexión.';
  }
  const chat=document.getElementById('chat-messages');
  chat.scrollTop=chat.scrollHeight;
}

function quickAsk(q){
  document.getElementById('chat-input').value=q;
  sendChat();
}

function addChatMsg(text,type){
  const el=document.createElement('div');
  el.className='chat-msg '+type;
  el.textContent=text;
  document.getElementById('chat-messages').appendChild(el);
  document.getElementById('chat-messages').scrollTop=9999;
  return el;
}

// ─── PDF ─────────────────────────────────────────────────────────
function generarPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const gm=gastosDelMes();
  const alqArs=cfg.alqUsd*cfg.tc;
  const totalViv=alqArs+cfg.exp;
  const gastCasa=gm.filter(g=>g.categoria==='casa').reduce((a,b)=>a+b.monto,0);
  const gastPar=gm.filter(g=>g.categoria==='pareja').reduce((a,b)=>a+b.monto,0);
  const gastPers=gm.filter(g=>g.categoria==='personal').reduce((a,b)=>a+b.monto,0);
  const gastAho=gm.filter(g=>g.categoria==='ahorro').reduce((a,b)=>a+b.monto,0);
  const gastNec=totalViv+gastCasa;
  const gastDes=gastPar+gastPers;
  const totalGast=gastNec+gastDes+gastAho;
  const sobrante=cfg.sueldo-totalGast;

  doc.setFillColor(15,15,19);doc.rect(0,0,210,297,'F');
  doc.setFillColor(124,109,250);doc.rect(0,0,210,18,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(14);doc.setFont('helvetica','bold');
  doc.text('RESUMEN FINANCIERO — fin.',14,12);
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text(monthLabel(currentMonth).toUpperCase(),160,12);

  let y=30;
  doc.setTextColor(144,144,168);doc.setFontSize(8);doc.text('INGRESOS Y BALANCE',14,y);
  y+=6;
  const metrics=[['Sueldo mensual',fmt(cfg.sueldo)],[`Total gastado`,fmt(totalGast)],['Disponible',fmt(Math.max(0,sobrante))]];
  metrics.forEach(([label,val],i)=>{
    const x=14+i*62;
    doc.setFillColor(30,30,39);doc.roundedRect(x,y,58,16,2,2,'F');
    doc.setTextColor(144,144,168);doc.setFontSize(7);doc.text(label,x+4,y+6);
    doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text(val,x+4,y+13);
    doc.setFont('helvetica','normal');
  });

  y+=24;
  doc.setTextColor(144,144,168);doc.setFontSize(8);doc.text(`REGLA ${cfg.nec}/${cfg.des}/${cfg.aho}`,14,y);y+=6;
  const cats=[{label:`Necesidades (${cfg.nec}%)`,pres:cfg.sueldo*cfg.nec/100,gast:gastNec},{label:`Deseos (${cfg.des}%)`,pres:cfg.sueldo*cfg.des/100,gast:gastDes},{label:`Ahorro (${cfg.aho}%)`,pres:cfg.sueldo*cfg.aho/100,gast:gastAho}];
  cats.forEach(({label,pres,gast})=>{
    const p=Math.min(100,pres>0?gast/pres*100:0);
    const col=p<70?[62,207,142]:p<90?[245,158,11]:[248,113,113];
    doc.setFillColor(30,30,39);doc.roundedRect(14,y,182,12,2,2,'F');
    doc.setFillColor(...col);doc.roundedRect(14,y,182*p/100,12,2,2,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont('helvetica','bold');doc.text(label,18,y+7.5);
    doc.setFont('helvetica','normal');doc.text(fmt(gast)+' / '+fmt(pres),140,y+7.5);
    y+=16;
  });

  y+=4;
  doc.setTextColor(144,144,168);doc.setFontSize(8);doc.text('POR TARJETA',14,y);y+=6;
  doc.autoTable({startY:y,theme:'plain',styles:{font:'helvetica',fontSize:9,textColor:[240,240,245],cellPadding:4},headStyles:{textColor:[144,144,168],fontSize:7,fontStyle:'normal'},head:[['Categoría','Monto']],body:[['🏠 Tarjeta Casa',fmt(gastCasa)],['💑 Tarjeta Pareja',fmt(gastPar)],['👤 Tarjeta Personal',fmt(gastPers)],['🔑 Alquiler + Expensas',fmt(totalViv)],['💰 Ahorro',fmt(gastAho)]],alternateRowStyles:{fillColor:[22,22,28]},tableLineColor:[40,40,52],tableLineWidth:0.1,margin:{left:14,right:14}});

  y=doc.lastAutoTable.finalY+10;
  if(gm.length>0){
    doc.setTextColor(144,144,168);doc.setFontSize(8);doc.text('MOVIMIENTOS DEL MES',14,y);y+=4;
    const catLabel={casa:'T. Casa',pareja:'T. Pareja',personal:'T. Personal',alquiler:'Alquiler',ahorro:'Ahorro',otro:'Otro'};
    doc.autoTable({startY:y,theme:'plain',styles:{font:'helvetica',fontSize:8,textColor:[240,240,245],cellPadding:3},headStyles:{textColor:[144,144,168],fontSize:7,fontStyle:'normal'},head:[['Fecha','Descripción','Categoría','Monto']],body:gm.map(g=>[g.fecha,g.descripcion,catLabel[g.categoria]||g.categoria,fmt(g.monto)]),alternateRowStyles:{fillColor:[22,22,28]},tableLineColor:[40,40,52],tableLineWidth:0.1,margin:{left:14,right:14},columnStyles:{0:{cellWidth:24},3:{halign:'right'}}});
  }

  doc.setTextColor(90,90,114);doc.setFontSize(7);
  doc.text('Generado por fin. — app de finanzas personales',14,290);
  doc.text(new Date().toLocaleDateString('es-AR'),170,290);
  doc.save(`finanzas-${currentMonth}.pdf`);
  toast('PDF descargado ✓');
}

// ─── UI HELPERS ──────────────────────────────────────────────────
function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ─── ARRANQUE ────────────────────────────────────────────────────
const saved=sessionStorage.getItem('fin_user');
if(saved){ currentUser=JSON.parse(saved); initApp(); }
